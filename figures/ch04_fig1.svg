<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-label="The same step costs more against the correlation than with it"><rect width="100%" height="100%" fill="#0b1622"/><text x="18" y="27" font-family="'Crimson Pro', Georgia, 'Times New Roman', serif" font-size="17" font-weight="600" fill="#e8ecf0">The same step costs more against the correlation than with it</text><line x1="50.00" y1="228.00" x2="420.00" y2="228.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><line x1="220.00" y1="68.00" x2="220.00" y2="388.00" stroke="#1b2e40" stroke-width="1" stroke-linecap="round" stroke-opacity="1.0"/><text x="420.00" y="246.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="end" font-weight="normal">Δa4 (autonomy)</text><text x="228.00" y="78.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#a9bccd" text-anchor="start" font-weight="normal">Δa9 (epistemic integrity)</text><ellipse cx="220.00" cy="228.00" rx="105.00" ry="105.00" transform="rotate(0 220.00 228.00)" fill="none" fill-opacity="1.0" stroke="#8fa4b8" stroke-width="1.5"><title>unit Euclidean length</title></ellipse><ellipse cx="220.00" cy="228.00" rx="132.82" ry="66.41" transform="rotate(-45 220.00 228.00)" fill="#66c2a5" fill-opacity="0.1" stroke="#66c2a5" stroke-width="2"><title>unit Mahalanobis cost</title></ellipse><line x1="220.00" y1="228.00" x2="294.25" y2="153.75" stroke="#fc8d62" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="294.25" y1="153.75" x2="292.32" y2="161.52" stroke="#fc8d62" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="294.25" y1="153.75" x2="286.48" y2="155.68" stroke="#fc8d62" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="220.00" y1="228.00" x2="145.75" y2="153.75" stroke="#e78ac3" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="145.75" y1="153.75" x2="153.52" y2="155.68" stroke="#e78ac3" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><line x1="145.75" y1="153.75" x2="147.68" y2="161.52" stroke="#e78ac3" stroke-width="2.5" stroke-linecap="round" stroke-opacity="1.0"/><text x="303.25" y="151.75" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">A</text><text x="136.75" y="151.75" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="end" font-weight="600">B</text><text x="448.00" y="96.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">every unit step has Euclidean length 1</text><text x="448.00" y="128.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">Mahalanobis cost Δvᵀ Σ⁻¹ Δv,</text><text x="448.00" y="146.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">covariance correlation 0.6:</text><text x="448.00" y="176.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">A  both rise together</text><text x="684.00" y="176.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="end" font-weight="normal">0.625</text><text x="448.00" y="200.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="start" font-weight="600">B  one falls, one rises</text><text x="684.00" y="200.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#e8ecf0" text-anchor="end" font-weight="normal">2.5</text><text x="448.00" y="240.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">the ellipse is the set of</text><text x="448.00" y="258.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">steps of unit cost</text><rect x="16.00" y="379.00" width="12" height="12" rx="3" fill="#8fa4b8"/><text x="34.00" y="389.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">unit Euclidean length</text><rect x="207.20" y="379.00" width="12" height="12" rx="3" fill="#66c2a5"/><text x="225.20" y="389.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a9bccd" text-anchor="start" font-weight="normal">unit Mahalanobis cost</text><text x="704.00" y="388.00" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8fa4b8" text-anchor="end" font-weight="normal" font-style="italic">illustrative covariance</text></svg>